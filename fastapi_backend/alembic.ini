# Alembic config: owns the whole database schema.
# The database URL comes from app.core.config (.env), not here.
#
#   cd fastapi_backend
#   alembic upgrade head
#
# Migrations are written by hand. 0000_baseline creates the core tables
# with the exact names and constraints the old Django migrations used;
# --autogenerate would try to rename them to match the models.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
