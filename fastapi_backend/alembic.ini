# Alembic config for schema changes owned by the FastAPI backend.
# The database URL comes from app.core.config (the shared .env), not here.
#
#   cd fastapi_backend
#   ../.venv-fastapi/Scripts/alembic upgrade head
#
# Migrations are written by hand. Do not use --autogenerate: the database
# also holds Django's tables, which the FastAPI models do not describe.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
